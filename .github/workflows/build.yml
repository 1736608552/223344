name: Build Android APK, iOS IPA & Windows PC

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platform-tools"
          sdkmanager "ndk;29.0.14033849"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - run: flutter pub get

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          if [[ "$TAG" == *"+"* ]]; then
            VERSION=${TAG%+*}
            BUILD=${TAG#*+}
            perl -i -pe "s/^version: .*/version: $VERSION+$BUILD/" pubspec.yaml
          else
            CURRENT_CODE=$(grep -E '^version:' pubspec.yaml | sed -n 's/.*+//p' | tr -d '\r\n')
            if [ -n "$CURRENT_CODE" ]; then
              perl -i -pe "s/^version: .*/version: $TAG+$CURRENT_CODE/" pubspec.yaml
            else
              perl -i -pe "s/^version: .*/version: $TAG+1/" pubspec.yaml
            fi
          fi
          head -5 pubspec.yaml

      - name: Build Android APK (release)
        uses: nick-fields/retry@v3
        with:
          max_attempts: 5
          retry_on: error
          retry_wait_seconds: 60
          timeout_minutes: 60
          command: flutter build apk --release --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Prepare Android artifacts
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '\r\n')
          BASE_VERSION="${VERSION%+*}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${BASE_VERSION}"
          fi
          mkdir -p android_dist
          cp build/app/outputs/flutter-apk/app-release.apk "android_dist/LunaTV-Mobile-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "android_dist/app-release.apk"

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android_dist/*.apk
          retention-days: 1

  build-ios:
    name: ios
    # v2.7.99: GitHub 已于 2026-11-02 退役 macOS 14 runner 镜像。
    #   原 runs-on: macos-14 的 job 会在启动前被直接取消（steps 为空、runner_id=0），
    #   check-run 注解原文：The configuration 'macos-14-arm64-us-default' is not supported。
    #   表现是 v2.7.96~v2.7.98 三版 Release 里完全没有 IPA（v2.7.47 还有）。
    #   改用当前 GA 的 macos-15（Apple Silicon 标准镜像），iOS 真机 arm64 产物原生产出。
    runs-on: macos-15
    env:
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      # 把镜像 / 架构 / Xcode / CocoaPods 版本打进日志，runner 换代后能第一时间看出差异
      - name: Show macOS toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          pod --version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          if [[ "$TAG" == *"+"* ]]; then
            VERSION=${TAG%+*}
            BUILD=${TAG#*+}
            perl -i -pe "s/^version: .*/version: $VERSION+$BUILD/" pubspec.yaml
          else
            CURRENT_CODE=$(grep -E '^version:' pubspec.yaml | sed -n 's/.*+//p' | tr -d '\r\n')
            if [ -n "$CURRENT_CODE" ]; then
              perl -i -pe "s/^version: .*/version: $TAG+$CURRENT_CODE/" pubspec.yaml
            else
              perl -i -pe "s/^version: .*/version: $TAG+1/" pubspec.yaml
            fi
          fi
          head -5 pubspec.yaml

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App (release no-codesign)
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_on: error
          retry_wait_seconds: 30
          # v2.7.99: 45 → 60。首次在干净 runner 上 pod install --repo-update 会拉全量 specs，
          #   45 分钟在 macos-15 上容易被 pod + Xcode 编译一起顶穿。
          timeout_minutes: 60
          command: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '\r\n')
          BASE_VERSION="${VERSION%+*}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${BASE_VERSION}"
          fi

          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到编译生成的 iOS .app 应用程序目录"
            exit 1
          fi
          echo "找到 iOS 应用目录: $APP_PATH"

          mkdir -p ipa_dist/Payload
          cp -r "$APP_PATH" ipa_dist/Payload/
          cd ipa_dist
          zip -r -y "LunaTV-Mobile-${TAG}-unsigned.ipa" Payload
          cp "LunaTV-Mobile-${TAG}-unsigned.ipa" "app-release-unsigned.ipa"
          rm -rf Payload
          cd ..

      - name: Upload IPA artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ipa_dist/*.ipa
          retention-days: 1

  build-windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          if [[ "$TAG" == *"+"* ]]; then
            VERSION=${TAG%+*}
            BUILD=${TAG#*+}
            perl -i -pe "s/^version: .*/version: $VERSION+$BUILD/" pubspec.yaml
          else
            CURRENT_CODE=$(grep -E '^version:' pubspec.yaml | sed -n 's/.*+//p' | tr -d '\r\n')
            if [ -n "$CURRENT_CODE" ]; then
              perl -i -pe "s/^version: .*/version: $TAG+$CURRENT_CODE/" pubspec.yaml
            else
              perl -i -pe "s/^version: .*/version: $TAG+1/" pubspec.yaml
            fi
          fi
          head -5 pubspec.yaml

      - name: Build Windows App (release)
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_on: error
          retry_wait_seconds: 30
          timeout_minutes: 45
          command: flutter build windows --release

      - name: Package Windows Zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '\r\n')
          BASE_VERSION="${VERSION%+*}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${BASE_VERSION}"
          fi

          RELEASE_DIR=$(find build/windows -name "LunaTV.exe" -exec dirname {} \; | head -n 1)
          if [ -z "$RELEASE_DIR" ]; then
            RELEASE_DIR=$(find build/windows -type d -name "Release" | head -n 1)
          fi
          if [ -z "$RELEASE_DIR" ]; then
            echo "::error::未找到编译生成的 Windows Release 目录或 LunaTV.exe"
            exit 1
          fi
          echo "找到 Windows Release 目录: $RELEASE_DIR"

          mkdir -p win_dist
          7z a -tzip -mx=9 "win_dist/LunaTV-PC-${TAG}-windows-x64.zip" "./$RELEASE_DIR/*"
          cp "win_dist/LunaTV-PC-${TAG}-windows-x64.zip" "win_dist/LunaTV-PC-windows-x64.zip"

      - name: Upload Windows artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-pc
          path: win_dist/*.zip
          retention-days: 1

  build-tv:
    name: tv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Grant execute permission for gradlew
        run: chmod +x tv/gradlew

      - name: Build Release APKs
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5120m -XX:+UseG1GC"
        run: |
          cd tv
          ./gradlew assembleRelease --stacktrace

      - name: Prepare TV artifacts
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '\r\n')
          BASE_VERSION="${VERSION%+*}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${BASE_VERSION}"
          fi

          mkdir -p tv_dist
          echo "Listing all generated APKs in outputs:"
          find tv/app/build/outputs/apk/ -name "*.apk" -exec ls -la {} +

          # 1. 提取 standard 渠道的 arm64-v8a 包
          find tv/app/build/outputs/apk/ -path "*/standard/release/*arm64-v8a*.apk" -exec cp {} "tv_dist/LunaTV-TV-${TAG}-arm64-v8a.apk" \;
          cp "tv_dist/LunaTV-TV-${TAG}-arm64-v8a.apk" "tv_dist/LunaTV-TV-arm64-v8a.apk"

          # 2. 提取 standard 渠道的 armeabi-v7a 包
          find tv/app/build/outputs/apk/ -path "*/standard/release/*armeabi-v7a*.apk" -exec cp {} "tv_dist/LunaTV-TV-${TAG}-armeabi-v7a.apk" \;
          cp "tv_dist/LunaTV-TV-${TAG}-armeabi-v7a.apk" "tv_dist/LunaTV-TV-armeabi-v7a.apk"

          # 3. 提取 hisense 渠道的海信专用包 (armeabi-v7a 架构)
          find tv/app/build/outputs/apk/ -path "*/hisense/release/*armeabi-v7a*.apk" -exec cp {} "tv_dist/LunaTV-TV-${TAG}-hisense.apk" \;
          cp "tv_dist/LunaTV-TV-${TAG}-hisense.apk" "tv_dist/LunaTV-TV-hisense.apk"

          echo "Final prepared TV artifacts:"
          ls -la tv_dist/

      - name: Upload TV APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: tv_dist/*.apk
          retention-days: 1

  release:
    name: release
    needs: [build-android, build-ios, build-windows, build-tv]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success' || needs.build-windows.result == 'success' || needs.build-tv.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts

      # v2.7.99: 以前 iOS job 静默死掉时，Release 照样发出去、只是少一个 IPA，很难发现。
      #   这里把四端的 job 结果和实际拿到的产物对一遍，缺 IPA 时打 warning annotation。
      - name: Verify artifact coverage
        if: always()
        env:
          ANDROID_RESULT: ${{ needs.build-android.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          TV_RESULT: ${{ needs.build-tv.result }}
        run: |
          echo "job 结果：android=$ANDROID_RESULT ios=$IOS_RESULT windows=$WINDOWS_RESULT tv=$TV_RESULT"
          echo "实际下载到的产物："
          find downloaded_artifacts -type f \( -name "*.apk" -o -name "*.ipa" -o -name "*.zip" \) -exec ls -lh {} + 2>/dev/null || echo "(无)"
          if [ -z "$(find downloaded_artifacts -type f -name '*.ipa' 2>/dev/null)" ]; then
            echo "::warning title=iOS 产物缺失::ios job 结果=${IOS_RESULT}，本次 Release 不含 IPA。请检查 macos runner 标签是否仍受支持。"
          fi

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PUBLIC_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 提取当前版本号与 Tag
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '\r\n')
          BASE_VERSION="${VERSION%+*}"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${BASE_VERSION}"
          fi

          echo "准备发布版本: $TAG (pubspec: $VERSION) 至独立分发仓库: 1736608552/LunaTV-Release"

          # 准备发布产物目录 (防御性创建 downloaded_artifacts 避免 find 报错)
          mkdir -p downloaded_artifacts
          mkdir -p release_dist
          find downloaded_artifacts -type f \( -name "*.apk" -o -name "*.ipa" -o -name "*.zip" \) -exec cp {} release_dist/ \; 2>/dev/null || true

          echo "收集到的发布产物列表:"
          ls -lh release_dist/

          if [ -z "$(ls -A release_dist 2>/dev/null)" ]; then
            echo "::error::未收集到任何 APK、IPA 或 ZIP 产物，发布终止"
            exit 1
          fi

          # 生成 SHA-256 校验清单
          cd release_dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

          # 实时提取当前版本的真实修复日记生成发布说明 (优先读取 .github/changelogs.json 与 FIXLOG.md)
          python3 .github/scripts/generate_release_notes.py "${TAG}"

          TITLE="LunaTV Mobile ${TAG}"

          # 专用在线更新分发中心：构建产物仅发布至 1736608552/LunaTV-Release，源仓库 223344 不发布
          TARGET_REPOS=("1736608552/LunaTV-Release")

          for REPO_TARGET in "${TARGET_REPOS[@]}"; do
            echo "::group::Publishing to $REPO_TARGET ..."
            for i in 1 2 3 4 5; do
              echo "Release attempt $i for $REPO_TARGET"
              if gh release view "$TAG" --repo "$REPO_TARGET" >/dev/null 2>&1; then
                echo "目标仓库 $REPO_TARGET 的 Release $TAG 已存在，更新产物附件与发布说明..."
                if gh release upload "$TAG" release_dist/* --clobber --repo "$REPO_TARGET" && \
                   gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md --repo "$REPO_TARGET"; then
                  echo "[$REPO_TARGET] Release 资源更新成功 (attempt $i)"
                  break
                fi
              else
                echo "向 $REPO_TARGET 创建全新 Release $TAG..."
                if gh release create "$TAG" release_dist/* \
                  --repo "$REPO_TARGET" \
                  --title "$TITLE" \
                  --notes-file release_notes.md; then
                  echo "[$REPO_TARGET] Release 创建成功 (attempt $i)"
                  break
                fi
              fi
              if [ "$i" -eq 5 ]; then
                echo "::warning::[$REPO_TARGET] 发布尝试均失败，继续后续目标"
              fi
              sleep 10
            done
            echo "::endgroup::"
          done

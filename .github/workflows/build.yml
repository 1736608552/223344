name: Build Android APK

on:
  push:
    branches: [ main, 'trae/**' ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: write

# v2.0.8: 撤回 iOS 编译, 只编 Android
# 之前 v2.0.1 ~ v2.0.7 试过 windows / macos / ios, 全失败或太折腾:
#   - v2.0.0 windows + macos: 编译报错
#   - v2.0.1 iOS: BSD sed 失败 (已修)
#   - v2.0.2 / v2.0.3 iOS: artifact 上传失败
#   - v2.0.4 iOS xcodebuild archive: 失败
#   - v2.0.7 iOS zip 打包: 成功但用户装法跟 ad-hoc IPA 一样
# 用户决定: iOS 撤回, 只编 Android
jobs:
  # 单一 job 模式, build-android 直接做 release
  build:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platform-tools"
          sdkmanager "ndk;29.0.14033849"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - uses: subosito/flutter-action@v2
        with:
          # v2.5.75: 升 3.44.8 (2026-07-23 patch) — 修 3.44.0 Mali GPU 外纹理资源泄漏
          #   + 3.44.6 Linux native assets CMake 路径崩溃 + 3.44.8 instrument test crash.
          #   pubspec SDK constraint 已同步到 >=3.5.0 兼容 3.44 自带 Dart 3.9.
          #   历史: v2.5.71 #1395 跑过 3.44 通道, v2.5.74 #1402 降回 3.41.9 是因为 APK 体积.
          #   这次升 3.44.8, 若 APK 体积回归再降.
          flutter-version: '3.44.8'

      - run: flutter pub get

      # tag 触发时, 把 git tag 同步到 pubspec.yaml (build.gradle.kts 解析 pubspec 拿 version)
      # 注意: 不能用 `sed -i "..."` (macOS BSD sed 要求 -i 后带 backup 扩展名, e.g. `sed -i ''`,
      # 否则报 "undefined label" 错; GNU sed 不要求 -i 参数, 所以 Android runner OK,
      # macOS / Windows runner 必挂). 改用 perl -i -pe (perl 跨平台, Linux/macOS 都预装).
      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          if [[ "$TAG" == *"+"* ]]; then
            VERSION=${TAG%+*}
            BUILD=${TAG#*+}
            perl -i -pe "s/^version: .*/version: $VERSION+$BUILD/" pubspec.yaml
          else
            perl -i -pe "s/^version: .*/version: $TAG+1/" pubspec.yaml
          fi
          head -5 pubspec.yaml

      # release 签名: keystore 已提交在 android/app/release.keystore
      # build.gradle.kts 直接读取, 每次 CI 构建签名一致
      # 镜像 502 时 Flutter 会自动重试 1 次, 但 Aliyun/Huawei/Tencent 同步挂的时候
      # 重试不够, 这里用 nick-fields/retry 兜底网络瞬时故障
      # v2.2.0+53 aliyun 持续 502, retry 3 次/30s 不够 → 提到 5 次/60s, 给镜像
      # 恢复时间. Gradle 失败重跑会复用已下载的 artifact, 重试成本不高.
      - name: Build Android APK (release)
        uses: nick-fields/retry@v3
        with:
          max_attempts: 5
          retry_on: error
          retry_wait_seconds: 60
          timeout_minutes: 60
          command: flutter build apk --release --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols

      # 对齐 guoapp: 自动创建或更新 GitHub Release 并上传正式 APK 及校验文件
      - name: Create or Update GitHub Release (APK)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 提取当前版本号与 Tag
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '\r\n')
          BASE_VERSION="${VERSION%+*}"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${BASE_VERSION}"
          fi

          echo "准备发布版本: $TAG (pubspec: $VERSION)"

          # 准备发布产物目录
          mkdir -p release_dist
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK" ]; then
            cp "$APK" "release_dist/LunaTV-Mobile-${TAG}.apk"
            cp "$APK" "release_dist/app-release.apk"
          else
            echo "::error::未找到构建生成的 APK 文件: $APK"
            exit 1
          fi

          # 生成 SHA-256 校验清单
          cd release_dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

          # 编写发布说明 (采用 printf 避免 YAML 缩进解析干扰)
          {
            printf '%s\n\n' "## LunaTV Mobile 正式版发布"
            printf '%s\n' "### 核心特性与修复"
            printf '%s\n' "- 短剧硬件解密推流通道：全新接入官方 CENC (AES-128-CTR) 原生硬件解密推流，彻底终结红果等火山 CDN 视频流无限转圈无法播放的历史问题；"
            printf '%s\n' "- 多清晰度平滑切换：全面支持 1080P / 720P / 480P 解密流平滑热切；"
            printf '%s\n' "- 非短剧业务零影响：电影、电视剧、动漫、直播等业务 100% 保持稳定原生播放链路；"
            printf '%s\n' "- 自动化发布就绪：对齐 guoapp 规范，构建完成后自动挂载正式安装包与 SHA256 校验清单。"
            printf '\n%s\n' "### 安装包下载"
            printf '%s\n' "- LunaTV-Mobile-*.apk：正式版完整安装包（推荐安装）"
            printf '%s\n' "- SHA256SUMS.txt：安装包完整性校验值"
          } > release_notes.md

          TITLE="LunaTV Mobile ${TAG}"

          # 重试循环确保网络波动下稳定发布
          for i in 1 2 3 4 5; do
            echo "::group::Release attempt $i"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG 已存在，更新产物附件与发布说明..."
              if gh release upload "$TAG" release_dist/* --clobber && \
                 gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md; then
                echo "Release 资源更新成功 (attempt $i)"
                break
              fi
            else
              echo "创建全新 Release $TAG..."
              if gh release create "$TAG" release_dist/* \
                --title "$TITLE" \
                --notes-file release_notes.md \
                --target "${{ github.sha }}"; then
                echo "Release 创建成功 (attempt $i)"
                break
              fi
            fi
            echo "::endgroup::"
            if [ "$i" -eq 5 ]; then
              echo "::error::gh release create/upload 5次重试均失败"
              exit 1
            fi
            sleep 15
          done

      # 备用上传 APK 作为 action artifact (加 continue-on-error 防止私有库免费存储配额满导致中断)
      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

